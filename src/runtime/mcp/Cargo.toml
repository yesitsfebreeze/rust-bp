[package]
name = "mcp"
version.workspace = true
edition.workspace = true
description = "Rust development tools over MCP"
default-run = "mcp"

[lib]
path = "lib.rs"

[[bin]]
name = "mcp"
path = "main.rs"

[[test]]
name = "astgrep"
path = "../../../tests/mcp/astgrep.rs"

[[test]]
name = "integration"
path = "../../../tests/mcp/integration.rs"

[[test]]
name = "jev"
path = "../../../tests/mcp/jev.rs"

[[test]]
name = "usage"
path = "../../../tests/mcp/usage.rs"

[[test]]
name = "workspace"
path = "../../../tests/mcp/workspace.rs"

[[bin]]
name = "mcp-launcher"
path = "bin/mcp-launcher.rs"

[dependencies]
daemon = { path = "../daemon" }
serde_json.workspace = true
ureq.workspace = true
