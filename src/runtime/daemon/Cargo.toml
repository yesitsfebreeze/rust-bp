[package]
name = "daemon"
version.workspace = true
edition.workspace = true
description = "The hot-reload + profiler framework an agent drives through the `mcp` control server"
default-run = "daemon"

[lib]
path = "lib.rs"

[[bin]]
name = "daemon"
path = "bin/daemon.rs"

[[bin]]
name = "rustc-events"
path = "bin/rustc-events.rs"

[[bin]]
name = "viz"
path = "bin/viz.rs"

[dependencies]
serde_json.workspace = true
ureq.workspace = true
signal-hook.workspace = true
url = "2"

# OS calls live in platform.rs: POSIX on Linux/macOS, Win32 on Windows.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Time"] }
