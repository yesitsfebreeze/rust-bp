[package]
name = "gameplay"
version.workspace = true
edition.workspace = true
publish = false
description = "Counter-Strike gameplay, weapons, movement, and arena state"

[lib]
path = "lib.rs"

[dependencies]
engine = { path = "../engine" }
# Binaural HRTF weapon audio; the mixer runs at its fixed 44.1 kHz rate.
audio = { path = "../audio" }
# The weapon table: `weapons.toml` parses to `toml::Table`, no serde.
toml = "0.8"