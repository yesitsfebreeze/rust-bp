[package]
name = "engine"
version.workspace = true
edition.workspace = true
publish = false
description = "Engine math, collision, cvars, console, lighting, map assets, and rendering"

[lib]
path = "lib.rs"

[features]
# The GPU light bake's entry points and tests, for the baking tool.
gpu-bake = []

[dependencies]
linalg = { path = "linalg" }
# `gpu` packs the bake's BVH for the renderer's ray casts.
lightbake = { path = "lightbake", features = ["gpu"] }
# The window, input and renderer (`gpu`): winit and wgpu, ProggyClean
# rasterized by fontdue for the HUD.
fontdue = "0.9"
fontdb = "0.23"
ttf-parser = "0.25"
pollster = "0.4"
wgpu = "26"
winit = "0.30"
physics = { path = "physics" }
console = { path = "console" }
cvar = { path = "cvar" }

# Native text clipboard, without image encoding dependencies.
arboard = { version = "3.6", default-features = false }
