[workspace]
resolver = "2"
members = ["crates/boiler", "crates/boiler-mcp", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
debug = true