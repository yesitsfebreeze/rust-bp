[workspace]
resolver = "2"
# Ordinary Cargo manifests: the workspace loads before any build has run.
members = ["src/runtime/daemon", "src/runtime/mcp", "src/runtime/reload", "src/modules/engine", "src/modules/engine/physics", "src/modules/engine/linalg", "src/modules/engine/cvar", "src/modules/engine/console", "src/modules/engine/lightbake", "src/modules/gameplay"]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
macroquad = "0.4.16"

# The app uses Cargo's standard layout. `./setup.sh <name>` renames it.
# The framework crates live under src/runtime/.
[package]
name = "app"
version.workspace = true
edition.workspace = true
publish = false
description = "The player demo: the CS movement port in a first-person PBR arena with TOML cvars, an in-game console, 1.6 weapons and punch-through"

[dependencies]
gameplay = { path = "src/modules/gameplay" }
macroquad.workspace = true

# Dev: the inner loop (cargo test, cargo check). Workspace crates keep
# file:line tables for backtraces; dependencies carry no debug info at all,
# which is most of the link work.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release: what the daemon hot-swaps and what valgrind / `leaks` inspect.
# Line tables are all callgrind annotation and leak callstacks need; full
# debug info would only grow the binary. Never add `strip`, `lto` or
# `panic = "abort"` here: they remove the symbols the profilers report
# against and change the unwinding/heap paths being measured.
[profile.release]
debug = "line-tables-only"

[profile.release.package."*"]
debug = false

# Distribution: the small binary for shipping. Opt in with
# `cargo build --profile distribution`; nothing in the framework uses it.
[profile.distribution]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
