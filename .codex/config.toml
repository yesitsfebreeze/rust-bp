# Repository-specific tool selection. Global integrations remain installed.
# Start Codex from the project root; mcp.ps1 resolves its own working directory.
[mcp_servers.app]
command = "powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "./mcp.ps1"]
startup_timeout_sec = 120
tool_timeout_sec = 1200

# Charly and Voice were separately uninstalled from the user Codex configuration.

[features]
image_generation = false

[apps._default]
enabled = false

