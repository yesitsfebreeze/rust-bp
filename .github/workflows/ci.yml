name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer
      - uses: extractions/setup-just@v3
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p reload --no-default-features --locked
      - run: just ci
      - run: just smoke
      - name: Install native profiling tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          npm install --global @ast-grep/cli
      - name: Exercise every MCP tool
        if: runner.os == 'Linux'
        run: just e2e
