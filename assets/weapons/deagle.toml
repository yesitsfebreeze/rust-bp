# One weapon's 1.6 numbers, every value from Counter-Strike 1.6 (mp.dll).
# The game loads this at start and writes it back if missing; edit and rerun.
#
# heat.kind:
#   "shots"  - accuracy = base + shots^power / div, capped; shots count since
#              deploy/reload, never reset by waiting (1.6 resets only those).
#   "recover"- pistols: accuracy recovers toward max after firing;
#              spread states scale with (1 - accuracy).
#   "none"   - no accuracy factor; spread states are their `add` constants.
#
# spread states, spread = mul * factor + add per state, duck_* overriding when
# ducked and grounded: "air" while airborne; "still" under still_speed;
# "slow" under slow_speed; "fast" above it. Factor is `accuracy` for "shots"
# heat, (1 - accuracy) for "recover", and 1 for "none" (use `add`).
#
# punch states (mp.dll's KickBack): kick_x, kick_y, growth_x, growth_y,
# cap_x, cap_y, flip_rand; kick grows with consecutive shots and the
# horizontal kick flips direction at the flip_rand odds. `punch_x` instead is a
# fixed vertical kick (AWP, pistols' -2.0 degrees).

name = "deagle"
slot = 4
price = 650
ammo_price = 50
ammo_name = "50ae"
damage = 54.0
range = 4096.0
range_mod = 0.81
pen = 1
cycle = 0.225
auto = false
clip = 7
reserve = 35
maxspeed = 250.0
reload = 2.2
punch_x = -2.0
fire1 = "deagle-1.wav"
fire2 = "deagle-2.wav"
deploy_sound = "de_deploy.wav"
dry_sound = "dryfire_pistol.wav"
reload_sounds = ["de_clipout.wav@0.3", "de_clipin.wav@0.75"]

[heat]
kind = "recover"
window = 0.4
rate = 0.35
min = 0.55
max = 0.9

[spread]
still_speed = 0.0
slow_speed = 0.0

[spread.air]
mul = 1.5
[spread.still]
mul = 0.13
duck_mul = 0.115
[spread.fast]
mul = 0.25
