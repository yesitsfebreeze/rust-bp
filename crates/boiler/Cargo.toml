[package]
name = "boiler"
version.workspace = true
edition.workspace = true
description = "The framework lib: preset profiler channels, hot-reload supervisor, valgrind runner, Jev wire"

[dependencies]
serde_json = { workspace = true }
ureq = { workspace = true, optional = true }

[features]
default = []
# the Jev wire (TypeSafe System One) — only the MCP needs it; an executable
# built without the feature (and without ureq/rustls) stays a light build
jev = ["ureq"]